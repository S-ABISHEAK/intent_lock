[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "intentlock"
version = "0.1.0"
description = "Value-level Rule-of-Two enforcement for AI agents (SPEC.md §0)"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.110",
    "uvicorn>=0.29",
    "pydantic>=2.6",
    "mcp>=1.2,<2",  # SPEC §4 names FastMCP, which mcp 2.x renamed (D-017)
    "openai>=1.30",
    "pynacl>=1.5",
    "httpx>=0.27",
]

[project.optional-dependencies]
# Heavy, optional pieces of SPEC §4; see docs/DECISIONS.md D-007.
promptguard = ["transformers>=4.40", "torch>=2.2"]
browser = ["playwright>=1.44"]
dev = [
    "pytest>=8",
    "pytest-asyncio>=0.23",
    "hypothesis>=6.100",
    "ruff>=0.5",
]

[tool.setuptools.packages.find]
include = ["intentlock*", "approver*", "shop*", "agent*", "eval*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"

[tool.ruff]
line-length = 100
target-version = "py311"
# ruff 0.17 also formats ```python blocks in Markdown; SPEC.md must never be rewritten.
extend-exclude = ["*.md", ".venv"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
